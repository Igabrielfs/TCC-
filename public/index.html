<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Faz a página se ajustar à largura de celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in de humor</title>
  <!-- Fonte Nunito (Google Fonts): moderna, arredondada e fácil de ler -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cartao">
    <h1>Como você está hoje?</h1>
    <p class="subtitulo">Sua resposta é anônima.</p>

    <form id="form-checkin">
      <!-- Grupo de opções de humor: só é possível escolher uma -->
      <fieldset class="emojis">
        <legend class="so-leitor-de-tela">Escolha um emoji</legend>

        <label class="emoji">
          <input type="radio" name="humor" value="1">
          <span class="emoji-icone" aria-hidden="true">😢</span>
          <span class="emoji-texto">Muito mal</span>
        </label>

        <label class="emoji">
          <input type="radio" name="humor" value="2">
          <span class="emoji-icone" aria-hidden="true">😕</span>
          <span class="emoji-texto">Mal</span>
        </label>

        <label class="emoji">
          <input type="radio" name="humor" value="3">
          <span class="emoji-icone" aria-hidden="true">😐</span>
          <span class="emoji-texto">Neutro</span>
        </label>

        <label class="emoji">
          <input type="radio" name="humor" value="4">
          <span class="emoji-icone" aria-hidden="true">🙂</span>
          <span class="emoji-texto">Bem</span>
        </label>

        <label class="emoji">
          <input type="radio" name="humor" value="5">
          <span class="emoji-icone" aria-hidden="true">😄</span>
          <span class="emoji-texto">Muito bem</span>
        </label>
      </fieldset>

      <!-- Comentário opcional, com no máximo 280 caracteres -->
      <label for="comentario" class="rotulo">
        Escreva como se sente <span class="opcional">(opcional)</span>
      </label>
      <textarea id="comentario" name="comentario" rows="3" maxlength="280"
                placeholder="Escreva aqui, se quiser"></textarea>

      <button type="submit" class="botao">Enviar</button>
    </form>
  </main>
</body>
</html>
